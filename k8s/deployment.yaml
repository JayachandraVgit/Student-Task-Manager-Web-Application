apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-deployment
spec:
  # One replica: tasks are stored in a JSON file, so several pods would each
  # keep their own separate copy of the data.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
        - name: task-manager
          image: task-manager:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: task-manager-data
